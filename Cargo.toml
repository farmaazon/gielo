[package]
name = "gielo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
decorum = "0.3"
derive_more = "0.99"
float_eq = "1.0"
lazy_static = "1.4"
local_vec = "0.5"
rand = "0.8"
rand_distr = "0.4"
roots = { git = "https://github.com/farmaazon/roots-rs.git", rev="02947574ec685d20363dda2c8c3426138941a093" }
simple_logger = "4.0"
itertools = "0.10"
rustnomial = "0.3"

[dependencies.log]
version = "0.4"
features = ["max_level_info", "release_max_level_warn"]

[dependencies.slint]
version = "1.0.2"
default_features = false
features = ["compat-1-0", "std", "log", "backend-winit", "renderer-winit-femtovg"]

[dependencies.uom]
version = "0.34"
default-features = false
features = ["f32", "f64", "si", "std"]

[build-dependencies]
slint-build = "1.0.2"